name: PykMCItems
version: 1.0.0
main: pl.pykmcitems.plugin.Main
api-version: '1.21'
author: PykMC
description: Custom items plugin for Paper and Purpur

commands:
  koniczyna:
    description: Nadaje Koniczynke
    usage: /koniczyna
    permission: pykmcitems.koniczyna

  rog:
    description: Nadaje Rog Niebios
    usage: /rog
    permission: pykmcitems.rog

  glodomiot:
    description: Nadaje Glodomiot
    usage: /glodomiot
    permission: pykmcitems.glodomiot

  rozpadacz:
    description: Nadaje Rozpadacz
    usage: /rozpadacz
    permission: pykmcitems.rozpadacz

  topor:
    description: Daje Topór Wykluczenia
    usage: /topor
    permission: pykmcitems.topor

  rozga:
    description: Nadaje Rozge
    usage: /rozga
    permission: pykmcitems.rozga

  ustawglowke:
    description: Ustawia glowke uzywana przez Rozge
    usage: /ustawglowke
    permission: pykmcitems.ustawglowke

  katana:
    description: Nadaje Swiateczna Katane
    usage: /katana
    permission: pykmcitems.katana

  hydra:
    description: Nadaje Hydre
    usage: /hydra
    permission: pykmcitems.hydra

  lodolap:
    description: Nadaje Lodolap
    usage: /lodolap
    permission: pykmcitems.lodolap

  buda:
    description: Daje przedmiot Buda
    permission: pykmcitems.buda

permissions:
  pykmcitems.koniczyna:
    description: Pozwala nadawac Koniczynke
    default: op

  pykmcitems.rozpadacz:
    description: Pozwala nadawac Rozpadacz
    default: op

  pykmcitems.topor:
    description: Pozwala używać komendy topor
    default: op

  pykmcitems.rog:
    description: Pozwala nadawac Rog Niebios
    default: op

  pykmcitems.glodomiot:
    description: Pozwala nadawac Glodomiot
    default: op

  pykmcitems.hydra:
    description: Pozwala nadawac Hydre
    default: op

  pykmcitems.rozga:
    description: Pozwala nadawac Rozge
    default: op

  pykmcitems.ustawglowke:
    description: Pozwala ustawiac glowke Rozgi
    default: op

  pykmcitems.katana:
    description: Pozwala nadawac Swiateczna Katane
    default: op

  pykmcitems.lodolap:
    description: Pozwala nadawac Lodolap
    default: op
    
  pykmcitems.buda:
    description: Pozwala nadawac Bude
    default: op
